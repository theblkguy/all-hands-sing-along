# Fly.io deploy for All Hands Sing Along (SQLite volume + Tigris for audio).
# Change `app` if the name is taken: `fly apps create <name>` then update PHX_HOST.
#
# Audio: `fly storage create` (Tigris). The /data volume is for SQLite only.
# UPLOADS_PATH is a fallback if Tigris env vars are not set.

app = "all-hands-sing-along"
primary_region = "iad"

[build]

[env]
  PHX_HOST = "all-hands-sing-along.fly.dev"
  PHX_SERVER = "true"
  PORT = "8080"
  DATABASE_PATH = "/data/all_hands_sing_along.db"
  UPLOADS_PATH = "/data/uploads"
  POOL_SIZE = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "data"
  destination = "/data"
